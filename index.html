<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stealth Oni Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<!-- 名前・役割入力モーダル（初回参加時に表示。管理者には表示されない） -->
<div id="nameModal" class="modalOverlay">
  <div class="modalBox">
    <p>なまえを入力してください</p>
    <input type="text" id="nameInput" placeholder="例: たろう" maxlength="10">
    <p>役割を選んでください</p>
    <div class="roleChoiceGroup">
      <button type="button" class="roleChoiceBtn roleOni" data-role="oni">🔴 鬼</button>
      <button type="button" class="roleChoiceBtn rolePlayer" data-role="player">🔵 にげる</button>
    </div>
    <button id="nameSubmitBtn">参加する</button>
  </div>
</div>

<!-- 役割切り替えパネル（一般参加者のみ。後からいつでも鬼/にげるを切り替え可能） -->
<div id="roleSwitchControls" class="panel panelTopRight">
  <button type="button" class="roleChoiceBtn roleOni" data-role="oni">🔴 鬼</button>
  <button type="button" class="roleChoiceBtn rolePlayer" data-role="player">🔵 にげる</button>
</div>

<!-- 管理者用ボタン -->
<div id="adminControls" class="panel">
  <button id="drawAreaBtn">プレイエリア描く</button>
  <button id="finishAreaBtn" style="display:none;">エリア確定</button>
  <button id="cancelAreaBtn" style="display:none;">キャンセル</button>
  <button id="addZoneBtn">チェックポイント追加</button>
  <button id="startBtn">ゲーム開始</button>
  <button id="resetBtn">リセット</button>
</div>

<!-- プレイヤー用ボタン -->
<div id="playerControls" class="panel">
  <button id="caughtBtn">捕まった</button>
  <button id="freeBtn">復活</button>
</div>

<!-- Firebase -->
<!-- Firebase 8（scriptで使える安定版） -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>


<script src="main.js"></script>

<!-- Google Maps（APIキーを入れる） -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAkeALBpnbKTE6PtNZkI6VkYH5oi3xhOBw&libraries=geometry&callback=initMap"></script>

</body>
</html>
